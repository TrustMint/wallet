<!DOCTYPE html>
<html lang="ru" class="dark" style="background: #000;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Mobile Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    
    <!-- iOS Icons (Placeholder using Dicebear API for immediate visual, normally local files) -->
    <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=kvant-icon&backgroundColor=000000">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://esm.sh https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://*.supabase.co https://api.dicebear.com https://*.openstreetmap.org https://*.basemaps.cartocdn.com;
        connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org wss://*.supabase.co;
        object-src 'none';
        base-uri 'self';
    ">

    <title>КВАНТ | Логистика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --ios-blur: blur(30px);
    }
    
    html {
        height: 100vh;
        width: 100vw;
        background-color: #000;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        box-sizing: border-box;
    }
    
    body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: 'Inter', sans-serif;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        box-sizing: border-box;
    }
    
    #root {
        width: 100%;
        height: 100vh;
        position: relative;
    }
    
    ::-webkit-scrollbar { display: none; width: 0; background: transparent; }
    * { 
        -ms-overflow-style: none; 
        scrollbar-width: none; 
        box-sizing: border-box;
    }
    
    .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: var(--ios-blur);
        -webkit-backdrop-filter: var(--ios-blur);
    }
    
    .scrolling-touch { -webkit-overflow-scrolling: touch; }

    @keyframes liquidOpen {
        0% { opacity: 0; transform: scale(0.05) translate(-20px, 45px); border-radius: 80px; }
        60% { transform: scale(1.02) translate(0, 0); border-radius: 20px; }
        100% { opacity: 1; transform: scale(1) translate(0, 0); border-radius: 28px; }
    }

    @keyframes liquidClose {
        0% { opacity: 1; transform: scale(1) translate(0, 0); border-radius: 28px; }
        40% { border-radius: 20px; }
        100% { opacity: 0; transform: scale(0.05) translate(-20px, 45px); border-radius: 80px; }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .animate-liquid-open { transform-origin: top right; animation: liquidOpen 1.6s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    .animate-liquid-close { transform-origin: top right; animation: liquidClose 1.0s cubic-bezier(0.19, 1, 0.22, 1) forwards; pointer-events: none; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    
    /* LEAFLET CUSTOMIZATIONS */
    .leaflet-container {
        background: #111 !important;
        font-family: 'Inter', sans-serif;
    }
    .leaflet-control-attribution {
        background: rgba(0,0,0,0.5) !important;
        color: #666 !important;
        font-size: 8px !important;
    }
    .leaflet-control-attribution a {
        color: #666 !important;
    }
    .custom-div-icon {
        background: transparent;
        border: none;
    }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react/": "https://esm.sh/react@18.3.1/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
    "react-leaflet": "https://esm.sh/react-leaflet@4.2.1?external=react,react-dom,leaflet"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-black text-white antialiased">
    <div id="root" class="h-full w-full"></div>
    
    <script>
      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.warn('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
